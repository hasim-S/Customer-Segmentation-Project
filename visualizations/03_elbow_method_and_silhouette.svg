<svg width="850" height="420" viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <text x="425" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Cluster Optimization: Elbow Method &amp; Silhouette Analysis</text>
  
  <!-- Subplot 1: Elbow Curve -->
  <g transform="translate(60, 60)">
    <text x="160" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">The Elbow Method (WCSS vs k)</text>
    <!-- Axes -->
    <line x1="40" y1="280" x2="330" y2="280" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="40" y1="50" x2="40" y2="280" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Y Ticks -->
    <text x="30" y="60" text-anchor="end" font-size="10" fill="#64748b">250k</text>
    <text x="30" y="110" text-anchor="end" font-size="10" fill="#64748b">180k</text>
    <text x="30" y="160" text-anchor="end" font-size="10" fill="#64748b">110k</text>
    <text x="30" y="220" text-anchor="end" font-size="10" fill="#64748b">50k</text>
    <text x="30" y="280" text-anchor="end" font-size="10" fill="#64748b">0</text>
    
    <!-- Gridlines -->
    <line x1="40" y1="60" x2="330" y2="60" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="40" y1="110" x2="330" y2="110" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="40" y1="160" x2="330" y2="160" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="40" y1="220" x2="330" y2="220" stroke="#f1f5f9" stroke-width="1"/>
    
    <!-- Curve Points: k=1 to 10 -->
    <!-- k=1 (60,55), k=2 (90,120), k=3 (120,165), k=4 (150,205), k=5 (180,230), k=6 (210,245), k=7 (240,255), k=8 (270,263), k=9 (300,270) -->
    <polyline fill="none" stroke="#2563eb" stroke-width="3" points="60,60 90,135 120,180 150,215 180,238 210,252 240,262 270,270 300,275"/>
    
    <!-- Optimal Elbow Callout at k=5 -->
    <line x1="180" y1="50" x2="180" y2="280" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="180" cy="238" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <rect x="185" y="200" width="105" height="24" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="237" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Elbow (k = 5)</text>
    
    <!-- X labels -->
    <text x="60" y="295" text-anchor="middle" font-size="11" fill="#475569">1</text>
    <text x="90" y="295" text-anchor="middle" font-size="11" fill="#475569">2</text>
    <text x="120" y="295" text-anchor="middle" font-size="11" fill="#475569">3</text>
    <text x="150" y="295" text-anchor="middle" font-size="11" fill="#475569">4</text>
    <text x="180" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#ef4444">5</text>
    <text x="210" y="295" text-anchor="middle" font-size="11" fill="#475569">6</text>
    <text x="240" y="295" text-anchor="middle" font-size="11" fill="#475569">7</text>
    <text x="270" y="295" text-anchor="middle" font-size="11" fill="#475569">8</text>
    <text x="300" y="295" text-anchor="middle" font-size="11" fill="#475569">9</text>
    <text x="180" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Number of Clusters (k)</text>
  </g>

  <!-- Subplot 2: Silhouette Score -->
  <g transform="translate(470, 60)">
    <text x="160" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Silhouette Score vs k</text>
    <!-- Axes -->
    <line x1="40" y1="280" x2="330" y2="280" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="40" y1="50" x2="40" y2="280" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Y Ticks -->
    <text x="30" y="60" text-anchor="end" font-size="10" fill="#64748b">0.60</text>
    <text x="30" y="115" text-anchor="end" font-size="10" fill="#64748b">0.50</text>
    <text x="30" y="170" text-anchor="end" font-size="10" fill="#64748b">0.40</text>
    <text x="30" y="225" text-anchor="end" font-size="10" fill="#64748b">0.30</text>
    <text x="30" y="280" text-anchor="end" font-size="10" fill="#64748b">0.20</text>
    
    <!-- Gridlines -->
    <line x1="40" y1="60" x2="330" y2="60" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="40" y1="115" x2="330" y2="115" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="40" y1="170" x2="330" y2="170" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="40" y1="225" x2="330" y2="225" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Score points: k=2 (0.29->230), k=3 (0.47->130), k=4 (0.49->120), k=5 (0.55->85), k=6 (0.54->93), k=7 (0.53->100), k=8 (0.45->142), k=9 (0.44->150) -->
    <polyline fill="none" stroke="#10b981" stroke-width="3" points="70,230 105,130 140,120 175,85 210,93 245,100 280,142 315,150"/>
    
    <line x1="175" y1="50" x2="175" y2="280" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="175" cy="85" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <rect x="180" y="65" width="125" height="24" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="242" y="81" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Peak: 0.554 (k = 5)</text>
    
    <!-- X labels -->
    <text x="70" y="295" text-anchor="middle" font-size="11" fill="#475569">2</text>
    <text x="105" y="295" text-anchor="middle" font-size="11" fill="#475569">3</text>
    <text x="140" y="295" text-anchor="middle" font-size="11" fill="#475569">4</text>
    <text x="175" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#ef4444">5</text>
    <text x="210" y="295" text-anchor="middle" font-size="11" fill="#475569">6</text>
    <text x="245" y="295" text-anchor="middle" font-size="11" fill="#475569">7</text>
    <text x="280" y="295" text-anchor="middle" font-size="11" fill="#475569">8</text>
    <text x="315" y="295" text-anchor="middle" font-size="11" fill="#475569">9</text>
    <text x="190" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Number of Clusters (k)</text>
  </g>
</svg>